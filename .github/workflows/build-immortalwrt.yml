name: Build ImmortalWrt for ASUS TUF-AX4200Q

on:
  workflow_dispatch: # 직접 버튼을 눌러 수동 실행

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swift: true

      - name: Initialize Build Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk rsync gettext \
            git libncurses5-dev libssl-dev python3-distutils zlib1g-dev file wget \
            unzip python3-setuptools python3-pyelftools ccache
          sudo timedatectl set-timezone "Asia/Seoul"

      - name: Clone Source Code
        run: |
          git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt

      - name: Cache Build Dependencies & ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            openwrt/dl
          key: ${{ runner.os }}-openwrt-cache-${{ hashFiles('openwrt/feeds.conf.default') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-cache-

      - name: Add OpenClash Feed & Update Feeds
        run: |
          cd openwrt
          # 1. OpenClash Feed 추가
          echo "src-git openclash https://github.com/vernesong/OpenClash.git" >> feeds.conf.default

          # 2. Feed 업데이트 및 설치
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject OpenClash Assets & Custom Settings
        run: |
          cd openwrt

          # Alpha 테마 + 필수 종속 패키지(luci-app-alpha-config) 소스로 추가
          rm -rf package/luci-theme-alpha package/luci-app-alpha-config
          git clone --depth 1 https://github.com/derisamedia/luci-theme-alpha package/luci-theme-alpha
          git clone --depth 1 https://github.com/animegasan/luci-app-alpha-config package/luci-app-alpha-config

          # brand.png 교체 (상단바 + 로그인화면 로고 둘 다)
          curl -L --retry 3 --fail \
            "https://raw.githubusercontent.com/hckwon767/tuf4200q/refs/heads/main/brand.png" \
            -o /tmp/brand.png
          cp /tmp/brand.png package/luci-theme-alpha/luasrc/brand.png
          cp /tmp/brand.png package/luci-theme-alpha/luasrc/style/brand.png

          # Bandix (클라이언트별 트래픽 모니터링) — 소스로 clone
          rm -rf package/luci-app-bandix package/openwrt-bandix
          git clone --depth 1 https://github.com/timsaya/luci-app-bandix package/luci-app-bandix
          git clone --depth 1 https://github.com/timsaya/openwrt-bandix package/openwrt-bandix

          # zashboard 한국어 패치 (OpenClash UI)
          DASHBOARD_KO_VERSION="v3.15.0"
          DASHBOARD_KO_NAME="zashboard-ko"
          DASHBOARD_KO_UI_DIR="feeds/openclash/luci-app-openclash/root/usr/share/openclash/ui/zashboard"

          # 경로가 안 보일 경우 피드 루트 디렉토리 확인 대응
          if [ ! -d "feeds/openclash/luci-app-openclash" ]; then
            DASHBOARD_KO_UI_DIR="feeds/luci/applications/luci-app-openclash/root/usr/share/openclash/ui/zashboard"
          fi

          rm -rf /tmp/dashboard-ko "${DASHBOARD_KO_UI_DIR}"
          mkdir -p /tmp/dashboard-ko
          curl -L --retry 3 --fail \
            "https://github.com/hckwon767/dashboard-ko/releases/download/${DASHBOARD_KO_VERSION}/${DASHBOARD_KO_NAME}.zip" \
            -o /tmp/dashboard-ko/${DASHBOARD_KO_NAME}.zip
          unzip -q /tmp/dashboard-ko/${DASHBOARD_KO_NAME}.zip -d /tmp/dashboard-ko/extracted
          mkdir -p "${DASHBOARD_KO_UI_DIR}"
          if [ -f /tmp/dashboard-ko/extracted/index.html ]; then
            cp -a /tmp/dashboard-ko/extracted/. "${DASHBOARD_KO_UI_DIR}/"
          else
            SUBDIR=$(find /tmp/dashboard-ko/extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -n "${SUBDIR}" ] && [ -f "${SUBDIR}/index.html" ]; then
              cp -a "${SUBDIR}/." "${DASHBOARD_KO_UI_DIR}/"
            else
              echo "WARNING: could not locate index.html in ${DASHBOARD_KO_NAME}.zip" >&2
            fi
          fi
          rm -rf /tmp/dashboard-ko

          # OpenClash Smart Core (ARM64 Meta Core) 사전 내장
          OPENCLASH_CORE_DIR="feeds/openclash/luci-app-openclash/root/etc/openclash/core"
          if [ ! -d "feeds/openclash/luci-app-openclash" ]; then
            OPENCLASH_CORE_DIR="feeds/luci/applications/luci-app-openclash/root/etc/openclash/core"
          fi

          mkdir -p "${OPENCLASH_CORE_DIR}"
          rm -rf /tmp/openclash-core && mkdir -p /tmp/openclash-core
          if curl -L --retry 3 --fail \
               "https://raw.githubusercontent.com/vernesong/OpenClash/core/master/smart/clash-linux-arm64.tar.gz" \
               -o /tmp/openclash-core/clash-arm64.tar.gz; then
            tar -xzf /tmp/openclash-core/clash-arm64.tar.gz -C /tmp/openclash-core
            mv /tmp/openclash-core/clash "${OPENCLASH_CORE_DIR}/clash_meta"
            chmod +x "${OPENCLASH_CORE_DIR}/clash_meta"
          else
            echo "WARNING: failed to download OpenClash Smart core" >&2
          fi
          rm -rf /tmp/openclash-core

          # UCI 기본값 설정
          # (타임존/NTP/opkg-apk 미러는 default-settings-chn 패키지가 알아서 처리하므로 여기서는 생략)
          mkdir -p files/etc/uci-defaults
          cat << 'EOF' > files/etc/uci-defaults/99-custom
          uci set system.@system[0].hostname='ASUS_VPNBOX'
          uci set luci.main.lang='ko'
          uci set luci.main.mediaurlbase='/luci-static/alpha'
          uci commit luci

          uci set firewall.@defaults[0].flow_offloading='1'
          uci set firewall.@defaults[0].flow_offloading_hw='1'
          uci commit firewall

          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-custom

      - name: Generate Custom .config
        run: |
          cd openwrt
          cat << 'EOF' > .config
          # Target Hardware (ASUS TUF-AX4200Q)
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_asus_tuf-ax4200q=y

          # Initramfs Image Settings (복구용 initramfs만 별도 생성, 메인 이미지는 정상 persistent squashfs)
          CONFIG_TARGET_ROOTFS_INITRAMFS=y

          # Build Optimization (ccache)
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y

          # Theme
          # CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-theme-alpha=y
          CONFIG_PACKAGE_luci-app-alpha-config=y

          # 중국 네트워크 최적화 (타임존/NTP/apk 미러 자동 처리) + 한국어 병행
          CONFIG_PACKAGE_default-settings-chn=y
          CONFIG_LUCI_LANG_ko=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-i18n-package-manager-ko=y

          # Dashboard & Utilities
          CONFIG_PACKAGE_luci-mod-dashboard=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-attendedsysupgrade=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_irqbalance=y

          # FTP / DDNS
          CONFIG_PACKAGE_vsftpd=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts=y

          # OpenClash & Official Full Dependencies
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_ruby-psych=y
          CONFIG_PACKAGE_ruby-pstore=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_dnsmasq-full=y
          # CONFIG_PACKAGE_dnsmasq is not set
          CONFIG_PACKAGE_coreutils=y
          CONFIG_PACKAGE_coreutils-nohup=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_iptables=y
          CONFIG_PACKAGE_iptables-nft=y
          CONFIG_PACKAGE_iptables-mod-tproxy=y
          CONFIG_PACKAGE_iptables-mod-extra=y
          CONFIG_PACKAGE_kmod-ipt-tproxy=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_jq=y
          CONFIG_PACKAGE_jsonfilter=y

          # Hardware & Sensors
          CONFIG_PACKAGE_lm-sensors=y
          CONFIG_PACKAGE_collectd-mod-sensors=y
          CONFIG_PACKAGE_collectd=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-storage=y

          # Flow Offloading (firewall4 내장 기능 사용)
          CONFIG_PACKAGE_kmod-nft-offload=y

          # Bandix
          CONFIG_PACKAGE_bandix=y
          CONFIG_PACKAGE_luci-app-bandix=y

          # USB 저장장치 자동 마운트
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_automount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_kmod-nls-cp437=y
          CONFIG_PACKAGE_kmod-nls-utf8=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y

          # zram swap
          CONFIG_PACKAGE_zram-swap=y

          # 하드웨어 진단/활용 (AX4200Q: 2.5G 포트 x2, USB 3.2)
          CONFIG_PACKAGE_ethtool=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_libiperf3=y
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_usbids=y
          CONFIG_PACKAGE_kmod-usb-printer=y

          # USB 외장 스토리지 NAS 용도
          CONFIG_PACKAGE_smartmontools=y
          CONFIG_PACKAGE_smartmontools-drivedb=y
          CONFIG_PACKAGE_hd-idle=y
          CONFIG_PACKAGE_luci-app-hd-idle=y
          CONFIG_PACKAGE_luci-app-diskman=y
          EOF

          # 의존성 자동 체크 및 정돈
          make defconfig

      - name: Download Build Dependencies
        run: |
          cd openwrt
          make download -j$(nproc)
          # 다운로드 중 파손된 1KB 미만 불량 파일 선별 삭제
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        run: |
          cd openwrt
          # 메모리 오버플로우 방지를 위한 최적 병렬 스레드 적용
          BUILD_THREADS=$(($(nproc) + 1))
          echo "Building with $BUILD_THREADS threads..."
          make -j$BUILD_THREADS || make -j1 V=s

      - name: Prepare Artifacts for Release
        id: organize
        run: |
          cd openwrt/bin/targets/mediatek/filogic
          mkdir -p /tmp/release_files
          cp -a *sysupgrade.bin /tmp/release_files/ 2>/dev/null || true
          cp -a *factory.bin /tmp/release_files/ 2>/dev/null || true
          cp -a *initramfs*.bin /tmp/release_files/ 2>/dev/null || true
          cp -a *initramfs*.kernel /tmp/release_files/ 2>/dev/null || true
          cp -a config.buildinfo /tmp/release_files/ 2>/dev/null || true
          cp -a version.buildinfo /tmp/release_files/ 2>/dev/null || true
          cp -a feeds.buildinfo /tmp/release_files/ 2>/dev/null || true
          cp -a *.manifest /tmp/release_files/ 2>/dev/null || true
          cp -a sha256sums /tmp/release_files/ 2>/dev/null || true

          TAG_NAME="ImmortalWrt-ASUS-TUF-AX4200Q-$(date +'%Y.%m.%d-%H%M')"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "RELEASE_PATH=/tmp/release_files" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ImmortalWrt Release ${{ env.TAG_NAME }}
          files: ${{ steps.organize.outputs.RELEASE_PATH }}/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
